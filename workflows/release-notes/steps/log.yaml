type: template
# The log the notes are written from: the release, its date, the tag before it, every commit.
requires:
  - table_pattern: date
  - table_pattern: commits
text: |
  release: {{ if eq (output "to" | trim) "HEAD" }}unreleased{{ else }}{{ output "to" | trim }}{{ end }}
  date: {{ output "date" | trim }}
  since: {{ output "since" | trim | default "the first commit" }}

  {{ output "commits" }}
target:
  file: .memdoor/runs/release-notes-{{.partition}}.log
timeout: 1m
max_retries: 0
